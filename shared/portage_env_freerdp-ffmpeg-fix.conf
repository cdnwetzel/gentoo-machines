# /etc/portage/env/freerdp-ffmpeg-fix.conf
#
# net-misc/freerdp 3.29.0 does not build against current ffmpeg, which renamed
# the AAC profile constants FF_PROFILE_* -> AV_PROFILE_*. Mapping the old name
# onto the new one is enough; nothing else in freerdp's ffmpeg use is affected.
#
# Registered in tools/update-system.sh PORTAGE_WORKAROUNDS with max_version
# 3.29.0, so it is installed while freerdp is at or below that and removed
# automatically once the machine upgrades past it. Do not hand-add this to a
# package.env file — the registry owns both halves and will not clean up a copy
# it did not write.
CFLAGS="${CFLAGS} -DFF_PROFILE_AAC_MAIN=AV_PROFILE_AAC_MAIN"
