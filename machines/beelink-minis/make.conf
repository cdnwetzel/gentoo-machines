# /etc/portage/make.conf
# Gentoo Linux - Beelink MINI S (Intel Celeron N5095A / Jasper Lake)
# ============================================================================
# CONFIRMED HARDWARE (from live Fedora 43 harvest 2026-04-14):
#   CPU:     Intel Celeron N5095A @ 2.00 GHz (Jasper Lake / Tremont, 4C/4T, no HT)
#            NO AVX/AVX2/FMA/F16C/BMI1/BMI2 — Atom class
#   GPU:     Intel UHD Graphics [8086:4e55] (Jasper Lake Gen11, i915, DMC icl v1.9)
#   RAM:     8 GB DDR4-2666 SODIMM, single-channel (1/2 slots populated)
#   Storage: 238 GB M.2 SATA SSD (NGFF 2280) via AHCI — NO NVMe on this board
#   WiFi:    Intel Wireless-AC 3165 [8086:3165] (iwlwifi, 7265D firmware)
#   BT:      Intel [8087:0a2a] (btusb, ROM firmware — no download needed)
#   Ether:   Realtek RTL8168h/8111h [10ec:8168] (r8169)
#   Audio:   Intel Jasper Lake HDA [8086:4dc8] + codec (likely Realtek, TBD on boot)
#   Board:   AZW MINI S, AMI JTKT001 BIOS (2022-04-13), TPM 2.0, no dGPU
#   Suspend: Full S3 deep + hibernate (unlike SP6 which is s2idle-only)
#   EFI:     64-bit UEFI, Secure Boot disabled
# ============================================================================

# ============================================================================
# COMPILER FLAGS - Tremont (Jasper Lake Atom cores)
# ============================================================================
# -march=tremont: GCC 10+ native tuning for Tremont cores
# Do NOT use x86-64-v3 — it requires AVX2 which this CPU lacks
COMMON_FLAGS="-march=tremont -O2 -pipe"
CFLAGS="${COMMON_FLAGS}"
CXXFLAGS="${COMMON_FLAGS}"
FCFLAGS="${COMMON_FLAGS}"
FFLAGS="${COMMON_FLAGS}"

# ============================================================================
# PARALLELISM - 4 cores / 4 threads, 8 GB RAM (MINIMAL build profile)
# ============================================================================
# -j2 because 4 threads no-HT and only 8 GB RAM — -j4 will OOM on linking
MAKEOPTS="-j2 -l3"
EMERGE_DEFAULT_OPTS="--jobs=1 --load-average=3.0 --with-bdeps=y --verbose"

# ============================================================================
# TMPFS FOR PORTAGE - 4 GB tmpfs, disk fallback for large packages
# ============================================================================
# Add to /etc/fstab:
#   tmpfs /var/tmp/portage tmpfs size=4G,uid=portage,gid=portage,mode=775,nosuid,noatime,nodev 0 0
#
# Large packages that exceed 4GB tmpfs use /var/tmp/portage-disk via package.env:
#   /etc/portage/env/notmpfs.conf -> PORTAGE_TMPDIR="/var/tmp/portage-disk"
PORTAGE_TMPDIR="/var/tmp"

# ============================================================================
# PORTAGE FEATURES
# ============================================================================
# No ccache initially — 8 GB RAM + slow CPU means cache overhead often loses
# to plain builds. Revisit after first world rebuild.
FEATURES="parallel-fetch candy"

# ============================================================================
# USE FLAGS
# ============================================================================
# Core desktop
USE="X wayland egl opengl gles2 vulkan vaapi"

# Audio - HDA + HDMI via PipeWire
USE="${USE} alsa pipewire pulseaudio sound-server"

# Networking / Bluetooth
USE="${USE} bluetooth wifi networkmanager"

# Init system - OpenRC + elogind
USE="${USE} elogind -systemd dbus policykit udisks"

# Filesystem support
USE="${USE} fat exfat fuse"

# Compression (zram + portage)
USE="${USE} zstd lz4"

# General
USE="${USE} unicode nls threads ncurses readline"

# Hardware role — desktop / mini-PC, not a laptop
USE="${USE} acpi -laptop"

# Not present on this hardware
USE="${USE} -nvidia -nouveau -amdgpu -radeonsi -thunderbolt"

# ============================================================================
# HARDWARE VARIABLES
# ============================================================================
VIDEO_CARDS="intel"
INPUT_DEVICES="libinput"

# Tremont flag set — verified via /proc/cpuinfo on the actual hardware.
# Notable absences vs Skylake+: avx avx2 fma3 f16c (do NOT add these).
# Re-verify with cpuid2cpuflags after emerge.
CPU_FLAGS_X86="aes mmx pclmul popcnt rdrand sha sse sse2 sse4_1 sse4_2 ssse3"

# ============================================================================
# BOOT
# ============================================================================
GRUB_PLATFORMS="efi-64"
ACCEPT_LICENSE="*"

# ============================================================================
# LOCALE
# ============================================================================
L10N="en en-US"
LC_MESSAGES=C.utf8

# ============================================================================
# MICROCODE
# ============================================================================
# CPU: Family 6, Model 156 (0x9c), Stepping 0 -> Signature 0x000906c0
# (Jasper Lake Tremont). Microcode on live env was 0x24000026 and kernel flagged
# SRBDS as "Vulnerable: No microcode" — intel-microcode is REQUIRED.
MICROCODE_SIGNATURES="-s 0x000906c0"

# ============================================================================
# MIRRORS
# ============================================================================
GENTOO_MIRRORS="https://gentoo.osuosl.org/ \
    https://mirrors.rit.edu/gentoo/ \
    https://mirror.leaseweb.com/gentoo/"

# ============================================================================
# POST-INSTALL CHECKLIST
# ============================================================================
# 1. emerge sys-kernel/linux-firmware  (iwlwifi-7265D-29.ucode, i915/icl_dmc_ver1_09.bin)
# 2. emerge sys-firmware/intel-microcode  (signature 0x000906c0)
# 3. Secure Boot already disabled (verified in AMI JTKT001 BIOS)
# 4. Enable weekly fstrim (shared/fstrim-weekly) — SATA SSD supports TRIM
# 5. /etc/fstab tmpfs line for portage (see above)
# 6. Bootloader: GRUB EFI (--bootloader-id=Gentoo)
# 7. cpuid2cpuflags to verify CPU_FLAGS_X86 — expect NO avx/avx2/fma/f16c
# 8. Identify HDA codec on first boot: cat /proc/asound/card0/codec#0 | head
# 9. Consider adding a second 8 GB SODIMM — doubles iGPU memory bandwidth
