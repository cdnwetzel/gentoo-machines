# /etc/portage/make.conf
# Gentoo Linux - Dell XPS 13 9315
# ============================================================================
# LIVE-VERIFIED 2026-10-16: fresh OpenRC / no-multilib install (lean Sway build),
# dual-boot with Win 11. Body below is the deployed /etc/portage/make.conf as
# synced from the machine via USB. Governing docs: HANDOFF.md / RUNBOOK.md.
#
# CONFIRMED HARDWARE (live harvest, HANDOFF.md §2, 2026-10-16):
#   CPU:     Intel Core i5-1230U (Alder Lake, 2P+8E/12T, P 4.4 / E 3.3 GHz, 12MB L3)
#   GPU:     Intel Iris Xe 80EU [8086:46aa] (i915; adlp_dmc, adlp_guc_70, tgl_huc)
#   RAM:     8GB LPDDR5 soldered @ 5200 MT/s (Micron) — zram mandatory
#   NVMe:    256GB Phison PS5019-E19 PCIe4 [1987:5019] (DRAM-less), shared with Win
#   WiFi/BT: Intel AX211 160MHz CNVi [8086:51f0] (iwlwifi) + BT [8087:0033]
#   Audio:   SOF SoundWire — RT1316 speaker amp + RT714 codec/mic, no 3.5mm jack
#   Camera:  Intel IPU6EP [8086:465d] + OV01A10 + iVSC (LJCA USB bridge 8086:0b63)
#   TB:      2x Thunderbolt 4 (UCSI PD), no USB-A
#   Sleep:   s2idle only (Modern Standby)
#   EFI:     64-bit UEFI, Dell BIOS 1.39.0, Secure Boot off
#   Board:   Dell 0WWXF6 (A02) / XPS 13 9315
# ============================================================================

COMMON_FLAGS="-march=alderlake -O2 -pipe"
CFLAGS="${COMMON_FLAGS}"
CXXFLAGS="${COMMON_FLAGS}"
FCFLAGS="${COMMON_FLAGS}"
FFLAGS="${COMMON_FLAGS}"
RUSTFLAGS="-C target-cpu=alderlake -C opt-level=2"

# Measured with cpuid2cpuflags on this CPU 2026-10-16 (the old guessed list
# lacked avx_vnni bmi1 bmi2 vpclmulqdq)
CPU_FLAGS_X86="aes avx avx2 avx_vnni bmi1 bmi2 f16c fma3 mmx mmxext pclmul popcnt rdrand sha sse sse2 sse3 sse4_1 sse4_2 ssse3 vpclmulqdq"

# distcc helper = T5810 (192.0.2.125). The T5810's default gcc is 15; the laptop runs
# gcc 16, so name the compiler explicitly or remote jobs would use the wrong major.
# Update these two lines when the laptop's gcc major changes.
CC="x86_64-pc-linux-gnu-gcc-16"
CXX="x86_64-pc-linux-gnu-g++-16"
FEATURES="parallel-fetch distcc"
# -l keeps local load sane (preprocess + link stay local); -j feeds the 44-thread helper.
# 8 GB RAM: heavy C++/rust get env/j4.conf via package.env.
MAKEOPTS="-j24 -l10"
EMERGE_DEFAULT_OPTS="--jobs=2 --load-average=10 --with-bdeps=y --keep-going"

PORTAGE_TMPDIR="/var/tmp"

# --- USE: Wayland-only, no X11 server/clients, no translations, no docs ---
USE="-X wayland dbus elogind -systemd udev"
USE="${USE} pipewire alsa -pulseaudio screencast"
USE="${USE} vaapi -vulkan"
USE="${USE} zstd lz4 -nls -doc -gtk-doc -examples"
USE="${USE} -cups -bluetooth -gnome -kde -qt5 -qt6 -gpm -ldap -kerberos -wifi"

VIDEO_CARDS="intel"
INPUT_DEVICES="libinput"
GRUB_PLATFORMS="efi-64"
L10N="en en-US"
LC_MESSAGES=C.UTF-8
ACCEPT_LICENSE="*"

# Family 6 model 154 stepping 4 -> 0x000906a4 (only this CPU's microcode in the initramfs)
MICROCODE_SIGNATURES="-s 0x000906a4"

# PYTHON_TARGETS / PYTHON_SINGLE_TARGET unset on purpose: profile defaults.

GENTOO_MIRRORS="https://gentoo.osuosl.org/ https://mirrors.rit.edu/gentoo/ https://mirror.leaseweb.com/gentoo/"
