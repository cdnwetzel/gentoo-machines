# /etc/sysctl.d/99-vllm-t5810.conf
# Precision T5810 / E5-2699 v4 / 256 GB DDR4 — vLLM host tunables
# apply: sudo sysctl --system

# Never swap under inference load; keep page cache aggressive
vm.swappiness = 1
vm.dirty_ratio = 10
vm.dirty_background_ratio = 5
vm.zone_reclaim_mode = 0

# If BIOS Cluster-on-Die is enabled (2 NUMA nodes), stop the kernel
# migrating vLLM's pages between nodes mid-decode. Harmless on 1 node.
kernel.numa_balancing = 0

# Local API serving
net.core.somaxconn = 4096
net.ipv4.tcp_fastopen = 3
