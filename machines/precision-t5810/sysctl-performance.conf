# /etc/sysctl.d/99-precision-t5810-performance.conf
# Tuned for: Xeon E5-2699 v4 (22C/44T), 256GB DDR4 ECC, Samsung 990 PRO 2TB NVMe
# Profile: HIGH-POWER BUILD SERVER + DESKTOP WORKSTATION

# =============================================================================
# VM / Memory — 256GB RAM, massive parallelism
# =============================================================================
# Near-zero swappiness: 256GB means we should almost never need swap
# zram is there purely as a safety net, not for active use
vm.swappiness = 5

# Lower cache pressure: keep dentries/inodes hot (plenty of RAM)
vm.vfs_cache_pressure = 50

# Aggressive dirty page window for NVMe throughput
# With 256GB RAM, 40% dirty_ratio = ~100GB dirty pages before forced writeback
# This is safe: NVMe can flush fast, and we want maximum build throughput
vm.dirty_ratio = 40
vm.dirty_background_ratio = 10
vm.dirty_writeback_centisecs = 500

# High max_map_count for large builds (chromium, LLVM, firefox)
# and any future CUDA/ML workloads
vm.max_map_count = 1048576

# Overcommit: with 256GB + 128GB tmpfs, allow aggressive allocation
# Prevents spurious OOM on large parallel builds
vm.overcommit_memory = 0
vm.overcommit_ratio = 95

# =============================================================================
# Kernel / Scheduler — 44 threads, build-heavy workload
# =============================================================================
kernel.sched_autogroup_enabled = 1

# Increase PID limit for massive parallelism (44 threads × 6 emerge jobs × subprocesses)
kernel.pid_max = 131072

# Increase max threads system-wide
kernel.threads-max = 524288

# Increase inotify limits for large source trees (portage, kernel, chromium)
fs.inotify.max_user_watches = 524288
fs.inotify.max_user_instances = 1024

# Increase file descriptor limit
fs.file-max = 2097152

# =============================================================================
# Networking — 1GbE Intel I217-LM, large package downloads
# =============================================================================
net.core.rmem_max = 16777216
net.core.wmem_max = 16777216
net.ipv4.tcp_rmem = 4096 87380 16777216
net.ipv4.tcp_wmem = 4096 65536 16777216
net.ipv4.tcp_fastopen = 3

# Increase connection tracking for emerge parallel-fetch
net.core.somaxconn = 4096
net.core.netdev_max_backlog = 5000
