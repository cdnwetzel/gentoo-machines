# /etc/portage/make.conf
# Gentoo Linux - Dell Precision T5810
# ============================================================================
# CONFIRMED HARDWARE (from harvest.sh on Fedora 43 live USB, 2026-03-11):
#   CPU:     Intel Xeon E5-2699 v4 @ 2.20GHz (Broadwell-EP, 22C/44T, turbo 3.60GHz)
#   GPU:     2x NVIDIA GeForce GTX 1050 Ti [10de:1c82] (GP107, 4GB GDDR5 each)
#            - Slot 1: ZOTAC [19da:a454] @ PCI 03:00.0
#            - Slot 2: EVGA [3842:6251] @ PCI 04:00.0
#   RAM:     256GB DDR4 ECC (8x32GB)
#   NVMe:    Samsung 990 PRO 2TB [144d:a80c] — Gentoo root
#   SATA:    C610/X99 sSATA [8086:8d62] (AHCI) — optical + legacy
#   Optical: HL-DT-ST DVD-ROM
#   Ethernet: Intel I217-LM [8086:153a] (e1000e, 1GbE)
#   Audio:   C610/X99 HD Audio [8086:8d20] (snd_hda_intel, Realtek ALC3220)
#            + 2x NVIDIA GP107 HDMI Audio [10de:0fb9]
#   USB:     C610/X99 xHCI + 2x EHCI (USB 3.0 + 2.0)
#   MEI:     C610/X99 MEI Controller [8086:8d3a]
#   Board:   Dell 0HHV7N / Precision Tower 5810
#   BIOS:    A34 (10/19/2020)
#   EFI:     64-bit UEFI, Secure Boot DISABLED
#   Sleep:   s2idle only (workstation, usually always-on)
#   EDAC:    sb_edac (ECC error reporting)
#   Boot USB: SABRENT 466GB (Ventoy) — DO NOT TOUCH
# ============================================================================

# ============================================================================
# COMPILER FLAGS - Broadwell-EP microarchitecture (AVX2, no AVX-512)
# ============================================================================
COMMON_FLAGS="-march=broadwell -O2 -pipe"
CFLAGS="${COMMON_FLAGS}"
CXXFLAGS="${COMMON_FLAGS}"
FCFLAGS="${COMMON_FLAGS}"
FFLAGS="${COMMON_FLAGS}"

# ============================================================================
# PARALLELISM - 22 cores / 44 threads, 256GB DDR4 ECC
# ============================================================================
# -j$(nproc) = 44 threads for each package's internal make
# -l44 = cap system load at thread count (prevents oversubscription)
MAKEOPTS="-j44 -l44"

# --jobs=6: build 6 packages simultaneously (256GB RAM headroom)
# --load-average=44: total system load cap across all emerge jobs
# With 128GB tmpfs, even 6 concurrent large builds stay under memory pressure.
# If 6 large packages happen to collide (chromium + llvm + rust + gcc + firefox + qtwebengine)
# the load-average cap throttles naturally — emerges queue, never OOM.
EMERGE_DEFAULT_OPTS="--jobs=6 --load-average=44.0 --with-bdeps=y --verbose"

# ============================================================================
# TMPFS FOR PORTAGE - 128GB RAM-backed build (256GB total, half for builds)
# ============================================================================
# Add to /etc/fstab:
#   tmpfs /var/tmp/portage tmpfs size=128G,uid=portage,gid=portage,mode=775,nosuid,noatime,nodev 0 0
#
# 128GB tmpfs rationale:
#   - Biggest single package (chromium) peaks ~35-40GB
#   - With --jobs=6, worst case 6 large packages = ~120GB concurrent
#   - Remaining 128GB covers OS, kernel caches, zram, running services
#   - NO disk fallback needed (no package.env/notmpfs.conf on this machine)
#   - Builds run entirely in RAM — maximizes NVMe lifespan and build speed
PORTAGE_TMPDIR="/var/tmp"

# ============================================================================
# PORTAGE FEATURES
# ============================================================================
FEATURES="parallel-fetch candy ccache"
CCACHE_DIR="/var/cache/ccache"
CCACHE_SIZE="20G"

# ============================================================================
# USE FLAGS
# ============================================================================
# Core desktop
USE="X wayland egl opengl gles2 vulkan vaapi"

# Audio - C610/X99 HDA + NVIDIA HDMI via PipeWire
USE="${USE} alsa pipewire pulseaudio sound-server"

# Networking (wired only, no WiFi)
USE="${USE} networkmanager -wifi -bluetooth"

# Init system - OpenRC + elogind
USE="${USE} elogind -systemd dbus policykit udisks"

# NVIDIA / CUDA (dual GTX 1050 Ti)
USE="${USE} nvidia cuda"

# Filesystem support
USE="${USE} fat exfat fuse"

# Compression (zram + portage)
USE="${USE} zstd lz4"

# General
USE="${USE} unicode nls threads ncurses readline"

# Workstation — no laptop features
USE="${USE} -laptop -thunderbolt"

# Not present on this hardware
USE="${USE} -nouveau -amdgpu -radeonsi -iwlwifi"

# ============================================================================
# HARDWARE VARIABLES
# ============================================================================
VIDEO_CARDS="nvidia"
INPUT_DEVICES="libinput"

# Broadwell-EP Xeon E5-2699 v4 (no AVX-512)
# TODO: Verify with cpuid2cpuflags on live Gentoo system
CPU_FLAGS_X86="aes avx avx2 f16c fma3 mmx mmxext pclmul popcnt rdrand sse sse2 sse3 sse4_1 sse4_2 ssse3"

# ============================================================================
# BOOT
# ============================================================================
GRUB_PLATFORMS="efi-64"
ACCEPT_LICENSE="*"

# ============================================================================
# LOCALE
# ============================================================================
L10N="en en-US"
LC_MESSAGES=C.utf8

# ============================================================================
# MICROCODE
# ============================================================================
# CPU: Family 6, Model 79, Stepping 1 → Broadwell-EP
MICROCODE_SIGNATURES="-s 0x000406f1"

# ============================================================================
# PYTHON
# ============================================================================
PYTHON_TARGETS="python3_13 python3_14"
PYTHON_SINGLE_TARGET="python3_13"

# ============================================================================
# MIRRORS
# ============================================================================
GENTOO_MIRRORS="https://gentoo.osuosl.org/ \
    https://mirrors.rit.edu/gentoo/ \
    https://mirror.leaseweb.com/gentoo/"

# ============================================================================
# POST-INSTALL CHECKLIST
# ============================================================================
# 1. emerge sys-kernel/linux-firmware  (nvidia/gp107/*, no i915 needed)
# 2. emerge sys-firmware/intel-microcode
# 3. emerge x11-drivers/nvidia-drivers  (2x GTX 1050 Ti, kernel-open modules tools USE)
# 4. Enable fstrim.timer or weekly fstrim (NVMe 990 PRO TRIM-capable)
# 5. /etc/fstab tmpfs line for portage (see above)
# 6. mkdir -p /var/cache/ccache && chown root:portage && chmod 2775
# 7. Bootloader: GRUB EFI
# 8. cpuid2cpuflags to verify CPU_FLAGS_X86
# 9. Install 99-module-rebuild.install for automatic nvidia rebuild on kernel update
# 10. CRITICAL: Exclude SABRENT Ventoy USB from all install scripts
