# elogind idle-hibernate drop-in for Surface Pro 6
# Deploys to: /etc/elogind/logind.conf.d/20-idle-hibernate.conf
#
# Safety net: hibernate after 15 min idle regardless of XFCE session state.
# s2idle drains ~2-3%/hr (37Wh battery, WiFi PS disabled) — not enough for overnight.
# Hibernate is already configured (8GB swap file, GRUB resume params).
#
# xfce4-screensaver sets the elogind IdleHint via D-Bus, which triggers IdleAction.

[Login]
IdleAction=hibernate
IdleActionSec=15min
