# elogind idle-suspend drop-in for Surface Pro 6
# Deploys to: /etc/elogind/logind.conf.d/20-idle-hibernate.conf
#
# Safety net: suspend (s2idle) after 15 min idle regardless of XFCE session state.
# Hibernate crashes on SP6 (KBL i915 + NVMe swap file), so we use optimized s2idle instead.
# With PSR + DC states restored: ~1-1.5%/hr = survivable overnight on 37Wh battery.
#
# xfce4-screensaver sets the elogind IdleHint via D-Bus, which triggers IdleAction.

[Login]
IdleAction=suspend
IdleActionSec=15min
