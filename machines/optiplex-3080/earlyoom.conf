# /etc/conf.d/earlyoom — kill memory hogs before the kernel OOM thrashes.
# Headless automation host: protect the access path (sshd) and the scheduler
# (cronie) above all; no desktop session to preserve.
# -m 5: trigger below 5% free mem;  -s 20: require swap also below 20%.
EARLYOOM_ARGS="-m 5 -s 20 --prefer '(^|/)(node|python|java)' --avoid '(^|/)(sshd|cronie|crond|init|metalog|chronyd)$'"
