# OptiPlex 3080 — headless automation host
# i3-10105 Comet Lake (4C/8T, AVX2, no AVX-512) — GCC has no -march=cometlake,
# skylake is the correct target (fleet gotcha #18).
COMMON_FLAGS="-march=skylake -O2 -pipe"
CFLAGS="${COMMON_FLAGS}"
CXXFLAGS="${COMMON_FLAGS}"
FCFLAGS="${COMMON_FLAGS}"
FFLAGS="${COMMON_FLAGS}"
RUSTFLAGS="-C target-cpu=skylake -C opt-level=2"

# Measured from /proc/cpuinfo on the live machine 2026-10-15 (fleet gotcha #25;
# XPS 9315 as-built lesson: never guess this list). pni->sse3, fma->fma3.
CPU_FLAGS_X86="adx aes avx avx2 bmi1 bmi2 f16c fma3 mmx movbe pclmul popcnt rdrand rdseed sse sse2 sse3 sse4_1 sse4_2 ssse3"

# Family 6 model 165 stepping 3 -> 0x000a0653 (only this CPU's microcode)
MICROCODE_SIGNATURES="-s 0x000a0653"

# 8GB RAM today (16GB ordered) — constrained build profile (beelink pattern).
# Most builds arrive as binpkgs from the T5810 binhost; these settings are the
# local-fallback profile. Bump to -j8 -l8 if the 16GB upgrade lands.
MAKEOPTS="-j4 -l6"
EMERGE_DEFAULT_OPTS="--jobs=1 --load-average=6.0 --with-bdeps=y --verbose"

# USE — headless server: no X/wayland/sound/desktop stacks
USE="elogind -systemd dbus policykit"
USE="${USE} networkmanager -wifi -bluetooth"
USE="${USE} fat exfat fuse"
USE="${USE} zstd lz4"
USE="${USE} unicode nls threads ncurses readline"
USE="${USE} acpi"
USE="${USE} -X -wayland -egl -opengl -gles2 -vulkan -vaapi"
USE="${USE} -alsa -pipewire -pulseaudio -sound-server -cups"
USE="${USE} -laptop -thunderbolt"
USE="${USE} -nvidia -nouveau -amdgpu -radeonsi -iwlwifi"

# Intel UHD 630 (CometLake-S GT2, Gen9.5) — console only, no mesa pulled headless
VIDEO_CARDS="intel"

# Portage
ACCEPT_LICENSE="*"
ACCEPT_KEYWORDS="amd64"
PORTAGE_TMPDIR="/var/tmp"

# Python — match fleet (see optiplex-3090)
PYTHON_TARGETS="python3_13 python3_14"
PYTHON_SINGLE_TARGET="python3_13"

L10N="en en-US"
LC_MESSAGES=C.UTF-8
GENTOO_MIRRORS="https://gentoo.osuosl.org/ https://mirrors.rit.edu/gentoo/ https://mirror.leaseweb.com/gentoo/ https://distfiles.gentoo.org"
GRUB_PLATFORMS="efi-64"
