# /etc/sysctl.d/99-optiplex-3080-performance.conf
# Tuned for: i3-10105 (4C/8T), 8->16 GB DDR4-2666, NVMe Gen3 SSD, headless server

# --- VM / Memory ---
# Moderate swappiness: zram is fast (zstd on Comet Lake), swap there before OOM
vm.swappiness = 60

# Moderate VFS cache aging
vm.vfs_cache_pressure = 50

# NVMe absorbs writes fast — wider dirty window than SATA machines
vm.dirty_ratio = 30
vm.dirty_background_ratio = 10
vm.dirty_writeback_centisecs = 500

# --- Kernel / Scheduler ---
kernel.sched_autogroup_enabled = 1

# Allow unprivileged user namespaces (container-style automation tooling)
kernel.unprivileged_userns_clone = 1

# --- Networking ---
# Gigabit Ethernet tuning (Realtek r8169) — the only NIC on this box
net.core.rmem_max = 16777216
net.core.wmem_max = 16777216
net.ipv4.tcp_rmem = 4096 87380 16777216
net.ipv4.tcp_wmem = 4096 65536 16777216
