# /etc/sysctl.d/99-asrock-b550-performance.conf
# Tuned for: Ryzen 9 5950X (16C/32T), 64GB DDR4-3200, MAXIO MAP1202 2TB NVMe
# Profile: DESKTOP + BUILD MACHINE

# =============================================================================
# VM / Memory — 64GB RAM
# =============================================================================
# Low swappiness: 64GB should rarely need swap; zram is safety net
vm.swappiness = 10

# Moderate cache pressure: keep dentries/inodes warm
vm.vfs_cache_pressure = 75

# Dirty page tuning for NVMe throughput
# With 64GB RAM, 40% dirty_ratio = ~25GB dirty pages before forced writeback
vm.dirty_ratio = 40
vm.dirty_background_ratio = 10
vm.dirty_writeback_centisecs = 500

# High max_map_count for large builds (chromium, LLVM, firefox)
vm.max_map_count = 1048576

# Overcommit: with 64GB + 46GB tmpfs, allow reasonable allocation
vm.overcommit_memory = 0
vm.overcommit_ratio = 90

# =============================================================================
# Kernel / Scheduler — 32 threads, build-heavy workload
# =============================================================================
kernel.sched_autogroup_enabled = 1

# Increase PID limit for parallelism (32 threads x 3 emerge jobs x subprocesses)
kernel.pid_max = 131072

# Increase max threads system-wide
kernel.threads-max = 262144

# Increase inotify limits for large source trees (portage, kernel, chromium)
fs.inotify.max_user_watches = 524288
fs.inotify.max_user_instances = 1024

# Increase file descriptor limit
fs.file-max = 2097152

# =============================================================================
# Networking — 2.5GbE Intel I225-V + WiFi AX200
# =============================================================================
net.core.rmem_max = 16777216
net.core.wmem_max = 16777216
net.ipv4.tcp_rmem = 4096 87380 16777216
net.ipv4.tcp_wmem = 4096 65536 16777216
net.ipv4.tcp_fastopen = 3

# Increase connection tracking for emerge parallel-fetch
net.core.somaxconn = 4096
net.core.netdev_max_backlog = 5000
