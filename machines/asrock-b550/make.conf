# /etc/portage/make.conf
# Gentoo Linux - ASRock B550 Phantom Gaming-ITX/ax
# ============================================================================
# CONFIRMED HARDWARE (from harvest.sh on Fedora 43 live USB, 2026-04-05):
#   CPU:     AMD Ryzen 9 5950X (Zen 3 / Vermeer, 16C/32T, turbo 5.05GHz)
#   GPU:     NVIDIA GeForce RTX 3060 Ti LHR [10de:2489] (GA104, Ampere)
#            - MSI [1462:c972] @ PCI 06:00.0
#   RAM:     64GB DDR4-3200 (2x32GB Corsair CMK64GX4M2E3200C16), no ECC
#   NVMe:    MAXIO MAP1202 2TB (DRAM-less, PCIe 4.0) — Gentoo root
#   SATA:    1TB SATA SSD (unused, Windows/NTFS)
#   WiFi:    Intel Wi-Fi 6 AX200 [8086:2723] (iwlwifi)
#   BT:      Intel (btusb/btintel, via AX200)
#   Ethernet: Intel I225-V 2.5GbE [8086:15f3] (igc)
#   Audio:   Realtek ALC1220 [1022:1487] (snd_hda_intel) + NVIDIA GA104 HDMI
#   USB:     AMD B550 xHCI + Matisse USB 3.0
#   Board:   ASRock B550 Phantom Gaming-ITX/ax (mini-ITX)
#   BIOS:    P3.90 (10/01/2025)
#   EFI:     64-bit UEFI, Secure Boot DISABLED
#   Sleep:   S3 deep supported
#   Boot USB: Fedora 43 live
# ============================================================================

# ============================================================================
# COMPILER FLAGS - Zen 3 microarchitecture (AVX2, SHA, no AVX-512)
# ============================================================================
COMMON_FLAGS="-march=znver3 -O2 -pipe"
CFLAGS="${COMMON_FLAGS}"
CXXFLAGS="${COMMON_FLAGS}"
FCFLAGS="${COMMON_FLAGS}"
FFLAGS="${COMMON_FLAGS}"

# ============================================================================
# PARALLELISM - 16 cores / 32 threads, 64GB DDR4
# ============================================================================
# -j$(nproc) = 32 threads for each package's internal make
# -l32 = cap system load at thread count
MAKEOPTS="-j32 -l32"

# --jobs=3: build 3 packages simultaneously (64GB RAM)
# --load-average=32: total system load cap across all emerge jobs
# With 46GB tmpfs, 3 concurrent builds stay under memory pressure.
# Disk fallback handles the outliers (chromium, llvm, rust, gcc).
EMERGE_DEFAULT_OPTS="--jobs=3 --load-average=32.0 --with-bdeps=y --verbose"

# ============================================================================
# TMPFS FOR PORTAGE - 46GB RAM-backed build (64GB total)
# ============================================================================
# Add to /etc/fstab:
#   tmpfs /var/tmp/portage tmpfs size=46G,uid=portage,gid=portage,mode=775,nosuid,noatime,nodev 0 0
#
# 46GB tmpfs rationale:
#   - Most packages fit in <10GB
#   - Big outliers (chromium ~40GB, llvm, rust, gcc) use disk fallback
#   - Remaining ~18GB covers OS, kernel caches, zram, running services
PORTAGE_TMPDIR="/var/tmp"

# ============================================================================
# PORTAGE FEATURES
# ============================================================================
FEATURES="parallel-fetch candy ccache"
CCACHE_DIR="/var/cache/ccache"
CCACHE_SIZE="20G"

# ============================================================================
# USE FLAGS
# ============================================================================
# Core desktop
USE="X wayland egl opengl gles2 vulkan vaapi"

# Audio — Realtek ALC1220 HDA + NVIDIA HDMI via PipeWire
USE="${USE} alsa pipewire pulseaudio sound-server"

# Networking (WiFi + BT + wired)
USE="${USE} networkmanager wifi bluetooth"

# Init system — OpenRC + elogind
USE="${USE} elogind -systemd dbus policykit udisks"

# NVIDIA / CUDA (RTX 3060 Ti GA104 Ampere)
USE="${USE} nvidia cuda"

# Filesystem support
USE="${USE} fat exfat fuse"

# Compression (zram + portage)
USE="${USE} zstd lz4"

# General
USE="${USE} unicode nls threads ncurses readline"

# Desktop — not a laptop but not a workstation either
USE="${USE} -laptop"

# Not present on this hardware
USE="${USE} -nouveau -amdgpu -radeonsi"

# ============================================================================
# HARDWARE VARIABLES
# ============================================================================
VIDEO_CARDS="nvidia"
INPUT_DEVICES="libinput"

# Zen 3 (Ryzen 9 5950X)
# TODO: Verify with cpuid2cpuflags on live Gentoo system
CPU_FLAGS_X86="aes avx avx2 f16c fma3 mmx mmxext pclmul popcnt rdrand sha sse sse2 sse3 sse4_1 sse4_2 sse4a ssse3 vpclmulqdq"

# ============================================================================
# BOOT
# ============================================================================
GRUB_PLATFORMS="efi-64"
ACCEPT_LICENSE="*"

# ============================================================================
# LOCALE
# ============================================================================
L10N="en en-US"
LC_MESSAGES=C.utf8

# ============================================================================
# PYTHON
# ============================================================================
PYTHON_TARGETS="python3_13 python3_14"
PYTHON_SINGLE_TARGET="python3_13"

# ============================================================================
# MIRRORS
# ============================================================================
GENTOO_MIRRORS="https://gentoo.osuosl.org/ \
    https://mirrors.rit.edu/gentoo/ \
    https://mirror.leaseweb.com/gentoo/"

# ============================================================================
# POST-INSTALL CHECKLIST
# ============================================================================
# 1. emerge sys-kernel/linux-firmware  (iwlwifi, nvidia/ga104/*, intel BT)
# 2. emerge x11-drivers/nvidia-drivers  (RTX 3060 Ti, kernel-open + modules + tools)
# 3. Enable fstrim weekly (NVMe TRIM-capable)
# 4. /etc/fstab tmpfs line for portage (see above)
# 5. mkdir -p /var/cache/ccache && chown root:portage && chmod 2775
# 6. Bootloader: GRUB EFI
# 7. cpuid2cpuflags to verify CPU_FLAGS_X86
# 8. Install 99-module-rebuild.install for automatic nvidia rebuild on kernel update
