# /etc/sysctl.d/99-beelink-minis-performance.conf
# Tuned for: Celeron N5095A (4C/4T, no HT), 8 GB single-channel DDR4, SATA SSD

# --- VM / Memory ---
# Low swappiness: prefer RAM over zram (8 GB is tight, zram is fast on Tremont AES-NI)
vm.swappiness = 10

# Moderate VFS cache aging
vm.vfs_cache_pressure = 50

# Smaller dirty window than NVMe machines — SATA SSD has lower throughput
vm.dirty_ratio = 20
vm.dirty_background_ratio = 5

# SATA SSD writeback interval
vm.dirty_writeback_centisecs = 500

# --- Kernel / Scheduler ---
# Desktop responsiveness during emerge builds (critical on 4 threads / 8 GB)
kernel.sched_autogroup_enabled = 1

# Allow unprivileged user namespaces (Chrome sandbox, flatpak)
kernel.unprivileged_userns_clone = 1

# --- Networking ---
# Gigabit Ethernet tuning (Realtek r8169) — WiFi is only 1x1 AC so Ethernet is the real path
net.core.rmem_max = 16777216
net.core.wmem_max = 16777216
net.ipv4.tcp_rmem = 4096 87380 16777216
net.ipv4.tcp_wmem = 4096 65536 16777216

# Fast TCP connection resumption
net.ipv4.tcp_fastopen = 3
