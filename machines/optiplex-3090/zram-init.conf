# /etc/conf.d/zram-init - OptiPlex 3090 SFF (16GB DDR4)
# zram compressed swap: real working swap on a constrained-RAM system
# 8GB zstd-compressed zram ≈ 24-32GB effective with ~3:1 ratio

load_on_start=no       # zram is built-in (CONFIG_ZRAM=y), no module to load
unload_on_stop=no      # can't unload built-in module

# Number of zram devices
num_devices="1"

# Device 0: compressed swap
type0="swap"
size0="8192"           # 8GB (50% of RAM — useful headroom for chromium/builds)
algo0="zstd"           # Best compression ratio
maxs0="6"              # Max parallel compression streams (= physical cores)
labl0="zram_swap"
