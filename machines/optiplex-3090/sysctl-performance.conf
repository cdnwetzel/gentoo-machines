# /etc/sysctl.d/99-optiplex-3090-performance.conf
# Tuned for: Core i5-10505 (6C/12T), 16GB DDR4-2666, 256GB NVMe
# Profile: CONSTRAINED-RAM DESKTOP (mid-tier SFF, single-channel)

# =============================================================================
# VM / Memory — 16GB RAM, modest parallelism
# =============================================================================
# 16GB is tight for builds — keep some swap pressure (zram is fast)
vm.swappiness = 10

# Default cache pressure: balance dentries/inodes vs. file pages
vm.vfs_cache_pressure = 75

# Conservative dirty page window for 16GB RAM + NVMe
# 20% of 16GB = ~3.2GB dirty pages before forced writeback
vm.dirty_ratio = 20
vm.dirty_background_ratio = 5
vm.dirty_writeback_centisecs = 500

# Reasonable max_map_count (chromium, electron apps)
vm.max_map_count = 524288

# Standard overcommit
vm.overcommit_memory = 0
vm.overcommit_ratio = 80

# =============================================================================
# Kernel / Scheduler — 12 threads, mixed desktop+build workload
# =============================================================================
kernel.sched_autogroup_enabled = 1

# PID limit for parallel builds + browsers
kernel.pid_max = 65536

# Increase max threads system-wide
kernel.threads-max = 262144

# Increase inotify limits for source trees (portage, kernel)
fs.inotify.max_user_watches = 524288
fs.inotify.max_user_instances = 1024

# Increase file descriptor limit
fs.file-max = 1048576

# =============================================================================
# Networking — 1GbE Realtek RTL8168, package downloads
# =============================================================================
net.core.rmem_max = 16777216
net.core.wmem_max = 16777216
net.ipv4.tcp_rmem = 4096 87380 16777216
net.ipv4.tcp_wmem = 4096 65536 16777216
net.ipv4.tcp_fastopen = 3

# Increase connection tracking for emerge parallel-fetch
net.core.somaxconn = 4096
net.core.netdev_max_backlog = 5000
