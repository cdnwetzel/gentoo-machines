# /etc/portage/make.conf
# Gentoo Linux - Dell OptiPlex 3090 SFF
# ============================================================================
# CONFIRMED HARDWARE (from harvest.sh on Fedora live USB, 2026-04-27):
#   CPU:     Intel Core i5-10505 @ 3.20GHz (Comet Lake, 6C/12T, turbo 4.60GHz)
#   GPU:     Intel UHD Graphics 630 (Comet Lake-S GT2) [8086:9bc8] (i915)
#            + NVIDIA RTX A1000 [10de:25b0] (GA107GL Ampere, 8GB GDDR6)
#   RAM:     16GB DDR4-2666 (1x16GB Samsung M378A2G43BB3-CWE, single channel)
#            One slot empty — add 2nd 16GB to go dual-channel / 32GB.
#   NVMe:    256GB M.2 2230 (PCIe Gen3) — Gentoo root
#   SATA:    Q470 PCH-H RAID [8086:06d6] — set to AHCI mode in BIOS!
#   Audio:   Comet Lake PCH cAVS [8086:06c8] (snd_hda_intel + SOF)
#            Codec: Realtek ALC3246
#            + NVIDIA GA107 HDMI Audio [10de:2291]
#   Ethernet: Realtek RTL8111/8168 [10ec:8168] (r8169, 1GbE)
#   USB:     Comet Lake xHCI 3.1 [8086:06ed]
#   Board:   Dell 0CVN63 (Q470 chipset)
#   BIOS:    2.28.0 (11/30/2025)
#   EFI:     64-bit UEFI, Secure Boot DISABLED
#   Sleep:   S3 deep + s2idle, hibernate supported
#   No WiFi/BT (Dell SFF, wired only)
# ============================================================================

# ============================================================================
# COMPILER FLAGS - Comet Lake (Skylake microarch family, AVX2, no AVX-512)
# ============================================================================
COMMON_FLAGS="-march=skylake -O2 -pipe"
CFLAGS="${COMMON_FLAGS}"
CXXFLAGS="${COMMON_FLAGS}"
FCFLAGS="${COMMON_FLAGS}"
FFLAGS="${COMMON_FLAGS}"

# ============================================================================
# PARALLELISM - 12 threads, 16GB DDR4 (CONSTRAINED build profile)
# ============================================================================
# -j6 caps make jobs to half of threads — keeps memory headroom for chromium/llvm
# -l12 prevents oversubscription if multiple emerges run
MAKEOPTS="-j6 -l12"

# --jobs=1: serial package builds (16GB RAM can't safely build 2 large packages
# concurrently). Big packages (chromium, llvm, rust) fall back to disk via
# package.env -> portage_env_notmpfs.conf to avoid OOM.
EMERGE_DEFAULT_OPTS="--jobs=1 --load-average=12.0 --with-bdeps=y --verbose"

# ============================================================================
# TMPFS FOR PORTAGE - 7GB RAM-backed (16GB total, ~half for builds)
# ============================================================================
# Add to /etc/fstab (handled by gentoo_install_part2.sh):
#   tmpfs /var/tmp/portage tmpfs size=7G,uid=portage,gid=portage,mode=775,...
#
# 7GB tmpfs rationale:
#   - Most packages build in <2GB
#   - chromium/firefox/llvm/rust/gcc exceed 7GB → use disk via package.env
#   - Leaves 9GB+ for OS, kernel caches, zram, NVIDIA driver compile
PORTAGE_TMPDIR="/var/tmp"

# ============================================================================
# PORTAGE FEATURES
# ============================================================================
FEATURES="parallel-fetch candy ccache"
CCACHE_DIR="/var/cache/ccache"
CCACHE_SIZE="10G"

# ============================================================================
# USE FLAGS
# ============================================================================
# Core desktop
USE="X wayland egl opengl gles2 vulkan vaapi"

# Audio - SOF + HDA via PipeWire
USE="${USE} alsa pipewire pulseaudio sound-server"

# Networking (wired only, no WiFi)
USE="${USE} networkmanager -wifi -bluetooth"

# Init system - OpenRC + elogind
USE="${USE} elogind -systemd dbus policykit udisks"

# NVIDIA / CUDA (RTX A1000 GA107 Ampere)
USE="${USE} nvidia cuda"

# Filesystem support
USE="${USE} fat exfat fuse"

# Compression (zram + portage)
USE="${USE} zstd lz4"

# General
USE="${USE} unicode nls threads ncurses readline"

# Workstation — no laptop features
USE="${USE} -laptop -thunderbolt"

# Not present on this hardware
USE="${USE} -nouveau -amdgpu -radeonsi -iwlwifi"

# ============================================================================
# HARDWARE VARIABLES
# ============================================================================
# Intel iGPU (UHD 630) + NVIDIA discrete — both drivers
VIDEO_CARDS="intel iris nvidia"
INPUT_DEVICES="libinput"

# Comet Lake i5-10505 (Skylake-derived, AVX2, no AVX-512)
# TODO: Verify with cpuid2cpuflags on live Gentoo system
CPU_FLAGS_X86="aes avx avx2 f16c fma3 mmx mmxext pclmul popcnt rdrand sse sse2 sse3 sse4_1 sse4_2 ssse3"

# ============================================================================
# BOOT
# ============================================================================
GRUB_PLATFORMS="efi-64"
ACCEPT_LICENSE="*"

# ============================================================================
# LOCALE
# ============================================================================
L10N="en en-US"
LC_MESSAGES=C.utf8

# ============================================================================
# MICROCODE
# ============================================================================
# CPU: Family 6, Model 165 (0xA5), Stepping 5 → Comet Lake-S
MICROCODE_SIGNATURES="-s 0x000a0655"

# ============================================================================
# PYTHON
# ============================================================================
PYTHON_TARGETS="python3_13 python3_14"
PYTHON_SINGLE_TARGET="python3_13"

# ============================================================================
# MIRRORS
# ============================================================================
GENTOO_MIRRORS="https://gentoo.osuosl.org/ \
    https://mirrors.rit.edu/gentoo/ \
    https://mirror.leaseweb.com/gentoo/"

# ============================================================================
# POST-INSTALL CHECKLIST
# ============================================================================
# 1. emerge sys-kernel/linux-firmware  (i915/kbl_*, nvidia/ga107/*)
# 2. emerge sys-firmware/intel-microcode
# 3. emerge x11-drivers/nvidia-drivers  (kernel-open OK on Ampere GA107)
# 4. Enable fstrim weekly via /etc/local.d/fstrim-weekly.start
# 5. /etc/fstab tmpfs line for portage (handled by part2.sh)
# 6. mkdir -p /var/cache/ccache && chown root:portage && chmod 2775
# 7. Bootloader: GRUB EFI
# 8. cpuid2cpuflags to verify CPU_FLAGS_X86
# 9. Install 99-module-rebuild.install for automatic nvidia rebuild on kernel update
# 10. Consider adding 2nd 16GB DIMM for dual-channel + larger tmpfs
